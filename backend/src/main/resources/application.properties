spring.application.name=lookout

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.profiles.default=dev

spring.mvc.problemdetails.enabled=true

management.endpoint.health.show-details=when_authorized

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30d


lookout.admin.email=${LOOKOUT_ADMIN_EMAIL}
lookout.admin.password=${LOOKOUT_ADMIN_PASSWORD}

lookout.rum.max-events-per-batch=50
lookout.rum.max-body-bytes=32768
lookout.rum.partitions-ahead=3
lookout.rum.retention-days=30
lookout.rum.dedup-window-hours=48
